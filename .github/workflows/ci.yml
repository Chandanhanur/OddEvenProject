name: Continuous Integration & Docker Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Step 1: Compile Code and Run JUnit Tests
  # --------------------------------------------------------------------------
  build-and-test:
    name: Build & Run JUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run JUnit Tests (EvenOddtest.java)
        run: mvn clean test

      - name: Package Executable JAR
        run: mvn package -DskipTests

      - name: Archive Built JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/even-odd-app-1.0.0.jar
          retention-days: 7

  # --------------------------------------------------------------------------
  # Step 2: Build Docker Image & Push to Docker Hub (Gated on tests passing)
  # --------------------------------------------------------------------------
  docker-publish:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Built JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: chanda142425
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: chanda142425/even-odd-app
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

